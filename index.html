<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PKmon Card Vault</title>
<meta name="theme-color" content="#0B0E1C">
<meta name="description" content="Scan, grade, price and track a Pokémon TCG collection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen app, glass panels floating over slow holo-foil light blobs; bottom nav on phones, centred column on desktop */
:root{
  --bg:#EDEFFA; --ink:#15173A; --ink-2:#4A4F78; --ink-3:#7A7FA6;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.82); --glass-lo:rgba(255,255,255,.34);
  --stroke:rgba(255,255,255,.85); --edge:rgba(21,23,58,.10); --shade:rgba(46,52,130,.18);
  --fire:#E8361A; --water:#1C7FE0; --volt:#E9A800; --grass:#0F9D63; --psy:#C2338F;
  --good:#0E9F6E; --bad:#D92D4C; --warn:#C77700;
  --b1:#FF8CC6; --b2:#55D3FF; --b3:#FFD84D; --b4:#86F0A6;
  --font-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --blur:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080A16; --ink:#ECEEFF; --ink-2:#A7ACD3; --ink-3:#6E739C;
  --glass:rgba(24,28,58,.55); --glass-hi:rgba(40,46,92,.72); --glass-lo:rgba(255,255,255,.04);
  --stroke:rgba(255,255,255,.13); --edge:rgba(255,255,255,.08); --shade:rgba(0,0,0,.45);
  --fire:#FF6347; --water:#4FB3FF; --volt:#FFD23F; --grass:#3EE08F; --psy:#F06BC0;
  --good:#34D399; --bad:#FB6B85; --warn:#FFB547;
  --b1:#8E1E63; --b2:#0A5F8E; --b3:#76580C; --b4:#11603B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080A16; --ink:#ECEEFF; --ink-2:#A7ACD3; --ink-3:#6E739C;
  --glass:rgba(24,28,58,.55); --glass-hi:rgba(40,46,92,.72); --glass-lo:rgba(255,255,255,.04);
  --stroke:rgba(255,255,255,.13); --edge:rgba(255,255,255,.08); --shade:rgba(0,0,0,.45);
  --fire:#FF6347; --water:#4FB3FF; --volt:#FFD23F; --grass:#3EE08F; --psy:#F06BC0;
  --good:#34D399; --bad:#FB6B85; --warn:#FFB547;
  --b1:#8E1E63; --b2:#0A5F8E; --b3:#76580C; --b4:#11603B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* the artifact frame adds this; GitHub Pages does not */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ambient holo light */
.aura{position:fixed;inset:-20vmax;z-index:0;pointer-events:none;filter:blur(60px) saturate(1.2);opacity:.9}
.aura i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;mix-blend-mode:normal;animation:drift 26s ease-in-out infinite alternate}
.aura i:nth-child(1){background:var(--b1);left:8%;top:6%}
.aura i:nth-child(2){background:var(--b2);right:4%;top:22%;animation-duration:32s;animation-delay:-8s}
.aura i:nth-child(3){background:var(--b3);left:26%;bottom:4%;animation-duration:29s;animation-delay:-14s}
.aura i:nth-child(4){background:var(--b4);right:22%;bottom:16%;animation-duration:35s;animation-delay:-4s;width:34vmax;height:34vmax}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-5vmax) scale(1.12)}100%{transform:translate(-5vmax,4vmax) scale(.94)}}

/* glass */
.glass{position:relative;background:linear-gradient(155deg,var(--glass-hi),var(--glass) 42%,var(--glass-lo));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);
  border:1px solid var(--stroke);border-radius:var(--r-lg);
  box-shadow:0 1px 0 var(--stroke) inset,0 -1px 0 var(--edge) inset,0 18px 40px -18px var(--shade),0 2px 6px -2px var(--shade)}
.glass.flat{box-shadow:0 1px 0 var(--stroke) inset,0 6px 18px -10px var(--shade)}
.tilt{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}

/* shell */
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;margin:10px 12px 0;border-radius:18px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px}
.mode{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--edge);color:var(--ink-2);white-space:nowrap}
.mode b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.mode.off b{background:var(--warn)}
.top .sp{flex:1}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--edge);background:var(--glass-lo);cursor:pointer}
.icon-btn svg{width:19px;height:19px}
.sel{appearance:none;border:1px solid var(--edge);background:var(--glass-lo);border-radius:12px;padding:8px 28px 8px 11px;font-weight:600;font-size:13px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.sel option{background:var(--bg);color:var(--ink)}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:16px 16px 120px}
.view{display:grid;gap:16px;animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:.4;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,4.6vw,30px);font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.panel{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.stack{display:grid;gap:12px}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--edge);background:var(--glass-hi);border-radius:13px;padding:10px 15px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px var(--shade)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(135deg,var(--fire),color-mix(in srgb,var(--fire) 60%,var(--volt)));color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px var(--fire)}
.btn.blue{background:linear-gradient(135deg,var(--water),color-mix(in srgb,var(--water) 55%,var(--grass)));color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--edge);background:var(--glass-lo);white-space:nowrap}
.chip.foil{background:linear-gradient(110deg,#ff9ad5,#ffe48a,#8ff0c4,#8fd3ff,#d4a5ff);color:#1a1a33;border-color:transparent}
.chip.secret{background:var(--volt);color:#1d1600;border-color:transparent}
.chip.alt{background:var(--psy);color:#fff;border-color:transparent}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)}
.seg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--edge);background:var(--glass-lo);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 2px 8px -3px var(--shade)}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--edge);transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked+span{background:var(--grass)}
.switch input:checked+span::after{transform:translateX(19px)}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;border:1px solid var(--edge);background:var(--glass-lo);border-radius:12px;padding:10px 12px;min-width:0}
.inp::placeholder{color:var(--ink-3)}

/* scanner */
.stage{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:3/4;max-height:66vh;width:100%;background:#05060d;margin-inline:auto}
@media (min-width:900px){.stage{aspect-ratio:4/3;max-height:560px}}
.stage video,.stage canvas,.stage img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .hud{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:3}
.hud .chip{background:rgba(8,10,22,.55);color:#fff;border-color:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stage .meters{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:3}
.meter{background:rgba(8,10,22,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 8px;color:#fff}
.meter .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:700}
.meter .v{font-family:var(--font-m);font-size:16px;font-weight:700}
.meter .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b5a,#ffd23f,#3ee08f);transition:width .4s}
.stage .idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#e8eaff;padding:24px;z-index:2;
  background:radial-gradient(120% 80% at 50% 0%,rgba(85,211,255,.18),transparent 60%),radial-gradient(120% 80% at 50% 100%,rgba(255,140,198,.16),transparent 60%)}
.idle p{max-width:34ch;margin:8px auto 16px;color:#b9bde6}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.scan-ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.result .thumb{width:96px;aspect-ratio:63/88;border-radius:8px;object-fit:cover;background:var(--glass-lo);border:1px solid var(--edge)}
.tray{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.tray .t{flex:none;width:84px;scroll-snap-align:start;text-align:center;font-size:11px}
.tray .t img,.tray .t .ph{width:84px;aspect-ratio:63/88;border-radius:7px;object-fit:cover;border:1px solid var(--edge);background:var(--glass-lo);display:block;margin-bottom:4px}
.tray .t{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.gradebox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.gradeball{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--font-d);font-weight:800;font-size:28px;line-height:1;
  background:conic-gradient(var(--grass) calc(var(--p,0)*1%),var(--edge) 0);position:relative}
.gradeball::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.gradeball span{position:relative}
.gradeball small{display:block;font-family:var(--font-b);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);margin-top:3px}
.mrow{display:grid;grid-template-columns:78px 1fr 46px;gap:8px;align-items:center;font-size:13px}
.mrow .bar{height:7px;border-radius:7px;background:var(--edge);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--fire),var(--volt),var(--grass));transition:width .5s cubic-bezier(.2,.9,.3,1)}

/* KPIs + chart */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--font-m);font-size:clamp(21px,3.6vw,27px);font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;font-weight:700;margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)}
.chart{width:100%;height:220px;display:block}
.chart text{fill:var(--ink-3);font-family:var(--font-m);font-size:10px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:16px}
.tabs button{flex:none;border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 4px 12px -6px var(--shade)}

/* collection list */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:16px;cursor:pointer;transition:transform .2s,background .2s;border:1px solid transparent}
.item:hover{background:var(--glass-lo);border-color:var(--edge);transform:translateX(2px)}
.item img,.item .ph{width:46px;aspect-ratio:63/88;border-radius:5px;object-fit:cover;background:var(--glass-lo);border:1px solid var(--edge)}
.ph{display:grid;place-items:center;font-family:var(--font-d);font-size:13px;color:var(--ink-3)}
.item .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .val{text-align:right}
.item .val .num{font-weight:700}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 2px;border-bottom:1px solid var(--edge);margin-top:6px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* progress */
.prog{height:12px;border-radius:12px;background:var(--edge);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:12px;background:linear-gradient(90deg,var(--water),var(--psy),var(--fire),var(--volt));background-size:300% 100%;animation:sheen 6s linear infinite;transition:width .8s cubic-bezier(.2,.9,.3,1)}
@keyframes sheen{to{background-position:300% 0}}
.setcard{display:grid;gap:8px;padding:14px}
.setcard img{height:30px;width:auto;max-width:120px;object-fit:contain}

/* price compare */
.markets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.mk{padding:12px 14px;border-radius:16px;border:1px solid var(--edge);background:var(--glass-lo)}
.mk h3{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.mk dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:8px 0 0;font-size:13px}
.mk dt{color:var(--ink-2)} .mk dd{margin:0;text-align:right;font-family:var(--font-m);font-weight:700;font-variant-numeric:tabular-nums}
.mk a{font-size:12px;font-weight:700;color:var(--water);text-decoration:none}
.est{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--warn);text-transform:uppercase}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,8,20,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,.9,.3,1) both;background:var(--bg)}
.sheet.glass{background:linear-gradient(155deg,color-mix(in srgb,var(--bg) 82%,var(--glass-hi)),color-mix(in srgb,var(--bg) 94%,transparent))}
@media (min-width:800px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:88%}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.checkbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.checkbar.calm{border-color:var(--edge);background:var(--glass-lo)}
button.chip.chk{color:var(--warn);cursor:pointer;font:inherit;font-size:11.5px;font-weight:700}
@media (max-width:460px){
  .top{gap:6px;padding:8px 10px;margin:8px 8px 0}
  .top .icon-btn{width:34px;height:34px}
  .top .sel{padding:7px 22px 7px 8px;background-position:calc(100% - 12px) 52%,calc(100% - 7px) 52%}
  .brand{font-size:15px;gap:6px} .brand svg{width:24px;height:24px}
  .mode span{display:none} .mode{padding:4px 6px} .mode b{margin-right:0}
}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 8px}
.sheet-top .grab{margin:0}
#backBtn svg{width:20px;height:20px}
.grab{width:42px;height:5px;border-radius:5px;background:var(--edge);margin:0 auto 12px}
.detail-hero{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:18px;align-items:start}
@media (max-width:520px){.detail-hero{grid-template-columns:1fr}.detail-hero .holo{max-width:220px;margin-inline:auto}}
.holo{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:63/88;background:var(--glass-lo);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;box-shadow:0 20px 40px -18px var(--shade)}
.detail-hero .holo,.result .holo{width:100%}
.holo img,.holo .ph{width:100%;height:100%;object-fit:cover;display:grid}
.holo .ph{font-size:28px;background:linear-gradient(135deg,var(--glass-hi),var(--glass-lo))}
.holo::after{content:"";position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:var(--ho,0);transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 45%),linear-gradient(115deg,transparent 20%,rgba(255,120,200,.35) 35%,rgba(120,220,255,.35) 50%,rgba(255,230,120,.35) 65%,transparent 80%);background-size:100% 100%,250% 250%;background-position:center,var(--mx,50%) var(--my,50%)}
.holo:hover::after{--ho:.85}

/* trade */
.trade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.trade{grid-template-columns:1fr}}
.side{padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.side.mine{border-top:3px solid var(--water)}
.side.theirs{border-top:3px solid var(--fire)}
.tline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--glass-lo);border:1px solid var(--edge);font-size:13.5px}
.tline .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.x{border:0;background:transparent;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}

<script>
"use strict";
/* ============ PKmon core: env, state, storage, API, currency, pricing ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const today = () => new Date().toISOString().slice(0, 10);

const API = "https://api.pokemontcg.io/v2";
const PUBLIC_URL = "https://nk7ghub.github.io/pkmon/";
const LS = {
  get(k, d) { try { const v = localStorage.getItem("pkmon:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pkmon:" + k, JSON.stringify(v)); } catch { /* storage blocked or full */ } }
};

/* ---- environment: Claude artifact viewer vs open web ---- */
const ENV = {
  claude: !!(window.claude && typeof window.claude.use === "function"),
  online: false,       // can reach pokemontcg.io
  camera: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
  cap: { db: null, sample: null, downloads: null, user: null },
  uid: null, aiImages: false
};

/* ---- state ---- */
const S = {
  items: LS.get("items", []),       // cards + sealed
  alerts: LS.get("alerts", []),
  sets: LS.get("sets", []),         // tracked master sets [{id,name,series,printedTotal,total,logo}]
  history: LS.get("history", []),   // [{d, v, c}] daily portfolio snapshots (USD)
  settings: Object.assign({ cur: "USD", theme: "system", apiKey: "", src: "tcg", stack: true, sound: true, notify: false, master: true }, LS.get("settings", {})),
  rates: LS.get("rates", null),     // {base:"USD", t, r:{...}, src}
  view: "scan", ptab: "cards", trade: LS.get("trade", { mine: [], theirs: [] }),
  stackSession: []
};

/* ---- persistence: localStorage always; Claude db mirror when available ---- */
const writeChains = new Map();
function dbWrite(path, fn) {
  const prev = writeChains.get(path) || Promise.resolve();
  const next = prev.then(fn).catch(e => { if (e && e.code === "quota_exceeded") toast("Cloud storage is full. Remove some items or export a backup.", "bad"); });
  writeChains.set(path, next);
  return next;
}
function userRoot() { return ENV.cap.db && ENV.uid ? ENV.cap.db.doc("data/users/" + ENV.uid + "/vault") : null; }
/* cards added from the local card list have no prices yet: fetch them in one batch shortly after */
const PriceQueue = {
  ids: new Set(), tried: new Set(), timer: null,
  add(it) {
    if (!it || it.kind !== "card" || !it.cardId || String(it.cardId).startsWith("dex:") || (it.prices && (it.prices.tcg || it.prices.cm)) || this.tried.has(it.cardId)) return;
    this.ids.add(it.cardId); this.tried.add(it.cardId); clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 1500);
  },
  async run() {
    const ids = [...this.ids]; this.ids.clear(); if (!ids.length || ENV.claude || ENV.ptcg === false) return;
    const cards = await withTimeout(cardsByIds(ids), 25000, "slow").catch(() => []);
    if (!cards.length) { ids.forEach(i => this.tried.delete(i)); return; }   // try again on the next add or price refresh
    const map = new Map(cards.map(c => [c.id, c]));
    for (const it of S.items) { const c = map.get(it.cardId); if (!c || (it.prices && (it.prices.tcg || it.prices.cm))) continue;
      const fresh = itemFromCard(c, { variant: it.variant, foilGuess: it.cond && it.cond.foil });
      Object.assign(it, { prices: fresh.prices, variant: fresh.variant, rarity: it.rarity || fresh.rarity, setCode: fresh.setCode || it.setCode }); Store.saveItem(it); }
    snapshotHistory(); render(); renderTray();
  }
};
const Store = {
  saveItem(it) {
    LS.set("items", S.items); PriceQueue.add(it);
    const root = userRoot(); if (!root) return;
    const ref = root.collection("items").doc(it.id);
    dbWrite(ref.path, () => ref.set(JSON.parse(JSON.stringify(it))));
  },
  removeItem(id) {
    LS.set("items", S.items);
    const root = userRoot(); if (!root) return;
    const ref = root.collection("items").doc(id);
    dbWrite(ref.path, () => ref.delete());
  },
  saveAlert(a) {
    LS.set("alerts", S.alerts);
    const root = userRoot(); if (!root) return;
    const ref = root.collection("alerts").doc(a.id);
    dbWrite(ref.path, () => ref.set({ ...a }));
  },
  removeAlert(id) {
    LS.set("alerts", S.alerts);
    const root = userRoot(); if (!root) return;
    const ref = root.collection("alerts").doc(id);
    dbWrite(ref.path, () => ref.delete());
  },
  saveMeta() {
    LS.set("sets", S.sets); LS.set("history", S.history); LS.set("settings", S.settings);
    const root = userRoot(); if (!root) return;
    const body = { sets: S.sets, history: S.history.slice(-400), settings: { ...S.settings, apiKey: "" } };
    clearTimeout(Store._mt);
    Store._mt = setTimeout(() => dbWrite(root.path, () => root.set(body)), 800);
  },
  async loadCloud() {
    const root = userRoot(); if (!root) return false;
    try {
      const [meta, items, alerts] = await Promise.all([root.get(), root.collection("items").limit(1000).get(), root.collection("alerts").limit(500).get()]);
      if (items.size || meta.exists) {
        S.items = items.docs.map(d => ({ ...d.data() }));
        S.alerts = alerts.docs.map(d => ({ ...d.data() }));
        if (meta.exists) {
          const m = meta.data();
          S.sets = m.sets ? [...m.sets] : S.sets;
          S.history = m.history ? [...m.history] : S.history;
          if (m.settings) S.settings = Object.assign({}, S.settings, m.settings, { apiKey: S.settings.apiKey });
        }
        LS.set("items", S.items); LS.set("alerts", S.alerts); LS.set("sets", S.sets); LS.set("history", S.history);
      } else if (S.items.length) {
        // first cloud visit: push local collection up
        for (const it of S.items) Store.saveItem(it);
        for (const a of S.alerts) Store.saveAlert(a);
        Store.saveMeta();
      }
      return true;
    } catch (e) { console.warn("cloud load", e); return false; }
  }
};

/* ---- pokemontcg.io client with 24h cache ---- */
const CACHE_TTL = 864e5;
async function api(path, { ttl = CACHE_TTL, signal } = {}) {
  const key = "api:" + path;
  const hit = LS.get(key, null);
  if (hit && Date.now() - hit.t < ttl) return hit.d;
  const headers = S.settings.apiKey ? { "X-Api-Key": S.settings.apiKey } : {};
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  signal && signal.addEventListener("abort", () => ctrl.abort());
  try {
    const r = await fetch(API + path, { headers, signal: ctrl.signal });
    if (r.status === 429) throw Object.assign(new Error("Card database rate limit reached. Add a free API key in Settings or wait an hour."), { code: 429 });
    if (!r.ok) throw new Error("Card database answered " + r.status);
    const d = await r.json();
    LS.set(key, { t: Date.now(), d });
    return d;
  } catch (e) {
    if (hit) return hit.d;         // stale cache beats nothing
    throw e;
  } finally { clearTimeout(timer); }
}
const SELECT = "id,name,number,rarity,subtypes,supertype,set,images,tcgplayer,cardmarket";
async function searchCards(q, pageSize = 24) {
  const d = await api(`/cards?q=${encodeURIComponent(q)}&pageSize=${pageSize}&orderBy=-set.releaseDate&select=${SELECT}`, { ttl: 6 * 36e5 });
  return d.data || [];
}
async function cardsByIds(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 40) {
    const chunk = ids.slice(i, i + 40);
    const q = "(" + chunk.map(id => "id:" + id).join(" OR ") + ")";
    const d = await api(`/cards?q=${encodeURIComponent(q)}&pageSize=250&select=${SELECT}`, { ttl: 6 * 36e5 });
    out.push(...(d.data || []));
  }
  return out;
}
/* pokemontcg.io ids in batches; "dex:" ids one by one from TCGdex */
async function fetchCardsAny(ids) {
  const p = ids.filter(i => !i.startsWith("dex:")), d = ids.filter(i => i.startsWith("dex:"));
  const out = p.length && ENV.ptcg !== false ? await cardsByIds(p).catch(() => []) : [];
  for (const id of d.slice(0, 60)) { try { out.push(mapDex(await dexGet("/cards/" + encodeURIComponent(id.slice(4))))); } catch { /* skip */ } }
  return out;
}
async function allSets() {
  const d = await api(`/sets?orderBy=-releaseDate&pageSize=250&select=id,name,series,printedTotal,total,releaseDate,images,ptcgoCode`, { ttl: 7 * CACHE_TTL });
  return d.data || [];
}
async function setCardList(setId) {
  const d = await api(`/cards?q=${encodeURIComponent("set.id:" + setId)}&pageSize=250&select=id,name,number,rarity,images`, { ttl: 7 * CACHE_TTL });
  return d.data || [];
}
async function probeOnline() {
  if (!navigator.onLine) return false;
  const tryFetch = async (url, opts = {}, ms = 20000) => {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms);
    try { const r = await fetch(url, { ...opts, signal: ctrl.signal }); return r.ok || r.status === 429; } catch { return false; } finally { clearTimeout(t); }
  };
  const [ptcg, dex] = await Promise.all([
    tryFetch(API + "/sets?pageSize=1&select=id", { headers: S.settings.apiKey ? { "X-Api-Key": S.settings.apiKey } : {} }),
    tryFetch(DEX + "/sets/base1")
  ]);
  ENV.ptcg = ptcg; ENV.dex = dex;
  return ptcg || dex;
}
/* ---- TCGdex backup database (free, no key): used when pokemontcg.io is slow, down, or misses a card ---- */
const DEX = "https://api.tcgdex.net/v2/en";
const DEX_TCG = { normal: "normal", holofoil: "holofoil", "reverse-holofoil": "reverseHolofoil", "1st-edition": "1stEditionNormal", "1st-edition-holofoil": "1stEditionHolofoil", unlimited: "unlimited", "unlimited-holofoil": "unlimitedHolofoil" };
function mapDex(d) {
  const pr = d.pricing || {}, tp = pr.tcgplayer || null, cm = pr.cardmarket || null;
  const tprices = {};
  if (tp) for (const [k, v] of Object.entries(tp)) if (DEX_TCG[k] && v && typeof v === "object") tprices[DEX_TCG[k]] = { low: v.lowPrice ?? v.low, mid: v.midPrice ?? v.mid, high: v.highPrice ?? v.high, market: v.marketPrice ?? v.market };
  const cc = (d.set && d.set.cardCount) || {};
  return {
    id: "dex:" + d.id, name: d.name, number: String(d.localId), rarity: d.rarity || "", subtypes: [], supertype: d.category || "",
    hp: d.hp || null, attacks: (d.attacks || []).map(a => ({ name: a.name })), abilities: (d.abilities || []).map(a => ({ name: a.name })),
    set: { id: d.set ? d.set.id : "", name: d.set ? d.set.name : "", series: (d.set && d.set.serie && d.set.serie.name) || "", printedTotal: cc.official || null, total: cc.total || cc.official || null, ptcgoCode: "" },
    images: { small: d.image ? d.image + "/low.webp" : null, large: d.image ? d.image + "/high.webp" : null },
    tcgplayer: Object.keys(tprices).length ? { url: null, updatedAt: tp.updated || null, prices: tprices } : null,
    cardmarket: cm ? { url: null, updatedAt: cm.updated || null, prices: { averageSellPrice: cm.avg, lowPrice: cm.low, trendPrice: cm.trend, avg1: cm.avg1, avg7: cm.avg7, avg30: cm.avg30, reverseHoloTrend: cm["trend-holo"], reverseHoloAvg1: cm["avg1-holo"], reverseHoloAvg7: cm["avg7-holo"], reverseHoloAvg30: cm["avg30-holo"] } } : null
  };
}
async function dexGet(path, ttl = 6 * 36e5) {
  const key = "dex:" + path, hit = LS.get(key, null);
  if (hit && Date.now() - hit.t < ttl) return hit.d;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 20000);
  try { const r = await fetch(DEX + path, { signal: ctrl.signal }); if (!r.ok) throw new Error("Backup card database answered " + r.status); const d = await r.json(); LS.set(key, { t: Date.now(), d }); return d; }
  catch (e) { if (hit) return hit.d; throw e; } finally { clearTimeout(t); }
}
async function dexCards(list, max = 8) {
  const out = [];
  for (const b of (list || []).slice(0, max)) { try { out.push(mapDex(await dexGet("/cards/" + encodeURIComponent(b.id)))); } catch { /* skip one */ } }
  return out;
}
async function dexFind({ number, total, name }) {
  let list = [];
  if (number) list = await dexGet("/cards?localId=eq:" + encodeURIComponent(number)).catch(() => []);

   closes the pop-up or returns to the previous screen instead of leaving the app.
   Inside Claude the frame's history is not ours to touch, so only the on-screen Back button is used. */
const Nav = {
  stack: [], sheet: false, ignore: 0, useHistory: false,
  init(first) {
    this.useHistory = !ENV.claude && !!(history && history.pushState) && /^https?:$/.test(location.protocol);
    if (!this.useHistory) return;
    history.replaceState({ pk: "root", v: first }, "", location.pathname + location.search + "#" + first);
    history.pushState({ pk: "view", v: first }, "", location.pathname + location.search + "#" + first);
    addEventListener("popstate", e => this.onPop(e.state || {}));
  },
  push(from, to) {
    this.stack.push(from);
    if (this.useHistory) history.pushState({ pk: "view", v: to }, "", location.pathname + location.search + "#" + to);
  },
  sheetOpened() { this.sheet = true; if (this.useHistory) history.pushState({ pk: "sheet", v: S.view }, "", location.href); },
  sheetClosed() { if (this.sheet && this.useHistory) { this.ignore++; history.back(); } this.sheet = false; },
  onPop(st) {
    if (this.ignore) { this.ignore--; return; }
    if ($("#sheetRoot .scrim")) { this.sheet = false; closeSheet(true); return; }
    if (st.pk === "root") {
      toast("Press back again to close PKmon");   // we're on the first entry now: the next Back leaves the app
      this.stack = []; this.refresh();
      return;
    }
    if (st.v && st.v !== S.view) { this.stack.pop(); setView(st.v, { fromPop: true }); }
  },
  back() {
    if ($("#sheetRoot .scrim")) return closeSheet();
    if (!this.stack.length) return;
    if (this.useHistory) history.back();
    else setView(this.stack.pop(), { fromPop: true });
  },
  refresh() { const b = $("#backBtn"); if (b) b.hidden = !($("#sheetRoot .scrim") || this.stack.length); }
};

/* ---------- sheet ---------- */
function openSheet(content) {
  const had = !!$("#sheetRoot .scrim");
  $("#sheetRoot").innerHTML = "";
  const sc = h("div", { class: "scrim", onclick: e => { if (e.target === sc) closeSheet(); } }, h("div", { class: "sheet glass", role: "dialog", "aria-modal": "true" },
    h("div", { class: "sheet-top" }, h("button", { class: "btn sm ghost", onclick: () => closeSheet(), html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back' }), h("div", { class: "grab" }), h("span", { style: "width:72px" })), content));
  $("#sheetRoot").append(sc); document.addEventListener("keydown", escClose);
  if (!had) Nav.sheetOpened();
  Nav.refresh();
  setTimeout(() => sc.querySelector("input,select,button:not(.ghost)")?.focus({ preventScroll: true }), 50);

function closeSheet(fromPop = false) {
  const had = !!$("#sheetRoot .scrim");
  $("#sheetRoot").innerHTML = ""; document.removeEventListener("keydown", escClose);
  if (had && !fromPop) Nav.sheetClosed();
  Nav.refresh();

function escClose(e) { if (e.key === "Escape") closeSheet(); }

      LS.set("items", []); LS.set("alerts", []); Store.saveMeta(); render(); toast("All data deleted");
    } }, "Delete everything"), h("button", { class: "btn ghost", onclick: () => render() }, "Keep my data"))));
}
async function restoreFrom(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== "PKmon" || !Array.isArray(d.items)) throw new Error("not a PKmon backup");
    const have = new Set(S.items.map(i => i.id)); let n = 0;
    for (const it of d.items) if (!have.has(it.id)) { S.items.push(it); Store.saveItem(it); n++; }
    for (const a of d.alerts || []) if (!S.alerts.some(x => x.id === a.id)) { S.alerts.push(a); Store.saveAlert(a); }
    for (const s of d.sets || []) if (!S.sets.some(x => x.id === s.id)) S.sets.push(s);
    const hm = new Map(S.history.map(x => [x.d, x])); for (const x of d.history || []) if (!hm.has(x.d)) hm.set(x.d, x);
    S.history = [...hm.values()].sort((a, b) => a.d.localeCompare(b.d));
    Store.saveMeta(); render(); toast(`Restored ${n} new items`);
    if (ENV.online) refreshPrices({ quiet: true }).then(render);
  } catch (e) { toast("Couldn't restore: " + e.message, "bad"); }
}

/* ---------- theme, currency, holo tilt ---------- */
function applyTheme(t) {
  S.settings.theme = t; Store.saveMeta();
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#themeBtn").innerHTML = t === "system" ? ICON.auto : dark ? ICON.moon : ICON.sun;
  $("#themeBtn").title = "Theme: " + (t === "system" ? "auto" : t);
  $('meta[name="theme-color"]').setAttribute("content", dark ? "#080A16" : "#EDEFFA");
}
function curSelect(id) {
  const s = h("select", { class: "sel", id, "aria-label": "Display currency", onchange: e => { S.settings.cur = e.target.value; Store.saveMeta(); $("#curSel").value = S.settings.cur; render(); } },
    ...Object.entries(CURRENCIES).map(([k, [n]]) => h("option", { value: k, selected: S.settings.cur === k }, `${k} · ${n}`)));
  return s;
}
document.addEventListener("pointermove", e => {
  const el = e.target.closest && e.target.closest(".holo"); if (!el) return;
  const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  el.style.setProperty("--ry", ((x - .5) * 16).toFixed(2) + "deg"); el.style.setProperty("--rx", ((.5 - y) * 16).toFixed(2) + "deg");
  el.style.setProperty("--mx", (x * 100).toFixed(1) + "%"); el.style.setProperty("--my", (y * 100).toFixed(1) + "%");
});
document.addEventListener("pointerout", e => { const el = e.target.closest && e.target.closest(".holo"); if (el && !el.contains(e.relatedTarget)) { el.style.setProperty("--rx", "0deg"); el.style.setProperty("--ry", "0deg"); } });

/* ---------- Install (PWA) ----------
   Chrome/Edge/Android: real one-tap prompt via beforeinstallprompt.
   iPhone/iPad Safari: no prompt exists, so show the Share → Add to Home Screen steps.
   Inside Claude: the artifact frame can't install anything, so open the web version. */
const Install = {
  evt: null,
  isIOS: () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  isStandalone: () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true,
  canShow() { return !this.isStandalone(); },   // always offer it; go() explains when this browser can't install
  refresh() { const b = $("#installBtn"); if (b) b.hidden = !this.canShow(); },
  async go() {
    if (ENV.claude) {
      const link = PUBLIC_URL + "#install";
      openSheet(h("div", { class: "stack" }, h("h2", {}, "Install PKmon"),
        h("p", { class: "small muted", style: "margin:0" }, "Claude can't install apps from inside a chat. Open PKmon in your browser and tap Install there. Your collection here can move across with Export → Full backup, then Settings → Restore."),
        h("div", { class: "row" }, h("a", { class: "btn primary", href: link, target: "_blank", rel: "noopener" }, "Open PKmon in browser ↗"), h("button", { class: "btn", onclick: () => copyText(PUBLIC_URL) }, "Copy link")),
        h("input", { class: "inp num", id: "instUrl", readonly: true, value: PUBLIC_URL, "aria-label": "PKmon web address" })));
      return;
    }
    if (!/^https?:$/.test(location.protocol)) {   // a downloaded copy (file:// or content://) can never be installed
      openSheet(h("div", { class: "stack" }, h("h2", {}, "Install from the live site"),
        h("p", { class: "small muted", style: "margin:0" }, "You're using a downloaded copy of PKmon. It can't be installed and has no live camera or prices. Open the live site, then tap Install there."),
        h("div", { class: "row" }, h("a", { class: "btn primary", href: PUBLIC_URL + "#install", target: "_blank", rel: "noopener" }, "Open live PKmon ↗"), h("button", { class: "btn", onclick: () => copyText(PUBLIC_URL) }, "Copy link"))));
      return;
    }
    if (this.evt) {
      this.evt.prompt();
      const { outcome } = await this.evt.userChoice.catch(() => ({ outcome: "dismissed" }));
      this.evt = null; this.refresh();
      if (outcome === "accepted") toast("Installing PKmon…");
      return;
    }
    const ios = this.isIOS();
    const share = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';
    openSheet(h("div", { class: "stack" }, h("h2", {}, "Install PKmon"),
      ios ? h("ol", { class: "stack", style: "margin:0;padding-left:20px;gap:8px" },
          h("li", { html: `Open this page in <b>Safari</b> (other iPhone browsers can't add apps).` }),
          h("li", { html: `Tap the <b>Share</b> button ${share} in the toolbar.` }),
          h("li", { html: `Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.` }))
        : h("ol", { class: "stack", style: "margin:0;padding-left:20px;gap:8px" },
          h("li", { html: `Open the browser menu (<b>⋮</b> in Chrome or Edge).` }),
          h("li", { html: `Tap <b>Install app</b> or <b>Add to Home screen</b>.` }),
          h("li", {}, "If neither shows, reload the page once and wait a few seconds: the browser only offers it after the page has loaded fully.")),
      h("p", { class: "small muted", style: "margin:0" }, "Your saved cards stay; the installed app uses the same storage as this page.")));
  }
};
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); Install.evt = e; Install.refresh(); });
window.addEventListener("appinstalled", () => { Install.evt = null; Install.refresh(); toast("PKmon installed. Find it on your home screen."); });

/* ---------- boot ---------- */
function setModeChip() {
  const c = $("#modeChip"); c.classList.toggle("off", !(ENV.online || ENV.claude));
  c.querySelector("span").textContent = ENV.claude ? (ENV.online ? "Claude · live" : "Claude mode") : ENV.online ? "Live" : "Offline";
  c.title = ENV.claude ? "Running inside Claude: AI card ID and cloud vault" : ENV.online ? "Connected: live prices and card lookup" : "Offline: showing saved prices";
}
async function boot() {
  applyTheme(S.settings.theme);
  const cs = $("#curSel"); for (const k of Object.keys(CURRENCIES)) cs.append(h("option", { value: k, selected: S.settings.cur === k }, k));
  cs.onchange = e => { S.settings.cur = e.target.value; Store.saveMeta(); render(); };
  $("#themeBtn").onclick = () => applyTheme({ system: "light", light: "dark", dark: "system" }[S.settings.theme]);
  $("#installBtn").onclick = () => Install.go(); Install.refresh();
  $$(".nav button").forEach(b => b.onclick = () => setView(b.dataset.v));
  for (const id of ["fileIn", "camIn"]) $("#" + id).addEventListener("change", e => {
    const f = [...(e.target.files || [])]; e.target.value = "";
    if (!f.length) return;
    if (S.view !== "scan") setView("scan");
    setTimeout(() => Scan.fromFiles(f).catch(err => toast("Scan failed: " + err.message, "bad")).finally(renderScanCtrls), 30);
  });
  $("#restoreIn").onchange = e => { if (e.target.files[0]) restoreFrom(e.target.files[0]); e.target.value = ""; };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(S.settings.theme));
  setModeChip();
  if (!ENV.claude && !/^https?:$/.test(location.protocol)) setTimeout(() => toast("You're using a downloaded copy: no live prices, camera or install. Open nk7ghub.github.io/pkmon instead.", "bad"), 1200);

  const hm = location.hash.match(/^#b=([jz][A-Za-z0-9_-]+)$/);
  if (hm && !ENV.claude) { ENV.online = await probeOnline(); setModeChip(); renderBinder(hm[1]); loadRates(); return; }

  // first paint: a #scan / #port / #trade / #set link wins, else Portfolio if the vault has cards, else Scanner
  const hv = (location.hash.match(/^#(scan|port|trade|set|install)$/) || [])[1];
  const firstView = hv && hv !== "install" ? hv : S.items.length ? "port" : "scan";
  setView(firstView, { fromPop: true }); Nav.init(firstView);
  $("#backBtn").onclick = () => Nav.back();
  if (hv === "install") setTimeout(() => Install.go(), 600);

  if (ENV.claude) {
    const [db, sample, downloads, user] = await Promise.all(["db", "sample", "downloads", "user"].map(n => window.claude.use(n).catch(() => null)));
    ENV.cap = { db, sample, downloads, user };
    if (user) ENV.uid = await user.id().catch(() => null);
    if (sample) { const lim = await sample.limits().catch(() => null); ENV.aiImages = !!(lim && lim.images); }
    if (db && ENV.uid) { const ok = await Store.loadCloud(); if (ok) render(); }
  }
  // the card list loads in the background straight away, so it's ready before the first scan
  if (!ENV.claude) CardIndex.load().then(i => { if (i) { const c = $("#modeChip"); if (c) c.title += ` · card list: ${i.cards.length.toLocaleString()} cards (${i.v})`; } });
  ENV.online = await probeOnline(); setModeChip();
  if (ENV.online) {
    await loadRates();
    await refreshPrices({ quiet: true });
    render();
    setInterval(() => refreshPrices({ quiet: true }).then(() => S.view === "port" && render()), 30 * 60e3);
  } else checkAlerts();
  snapshotHistory();

  // PWA on the web version
  if (!ENV.claude && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    if (!$('link[rel="apple-touch-icon"]')) document.head.append(h("link", { rel: "apple-touch-icon", href: "apple-touch-icon.png" }), h("meta", { name: "apple-mobile-web-app-capable", content: "yes" }), h("meta", { name: "mobile-web-app-capable", content: "yes" }), h("meta", { name: "apple-mobile-web-app-title", content: "PKmon" }));
    if (!$('link[rel="manifest"]')) document.head.append(h("link", { rel: "manifest", href: "pkmon.webmanifest" }));
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("pkmon-sw.js").catch(() => {});
  }
}
boot();
</script>
